spring:
  application:
    name: aiblog-backend
  datasource:
    url: jdbc:mysql://localhost:3306/aiblog?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  admin:
    username: admin
    password: changeme
  jwt:
    secret: Y2hhbmdlLXRoaXMtdG8teW91ci1vd24tc2VjcmV0LWtleS1hdC1sZWFzdC0yNTYtYml0cw==
    expiration-ms: 86400000
  storage:
    local:
      upload-dir: ./uploads
  ai:
    gpt:
      api-key: ${GPT_API_KEY:}
      model: gpt-4o
      api-url: https://api.openai.com/v1/chat/completions
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: claude-sonnet-4-20250514
      api-url: https://api.anthropic.com/v1/messages
    cache:
      ttl-hours: 24
